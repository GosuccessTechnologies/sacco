<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Divine Sacco</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #F7F9F8; color: #1B2420; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { max-width: 420px; padding: 40px 32px; background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08); text-align: center; }
    h1 { font-size: 22px; margin: 12px 0 6px; }
    p { color: #5C6B63; font-size: 14px; line-height: 1.6; }
    .badge { width: 64px; height: 64px; margin: 0 auto; border-radius: 18px; background: linear-gradient(135deg, #0E7C5A, #0A5C43); display: grid; place-items: center; color: #fff; font-size: 28px; }
    button { margin-top: 18px; background: #0E7C5A; color: #fff; border: 0; padding: 12px 28px; border-radius: 10px; font-weight: 600; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🏦</div>
    <h1>You're offline</h1>
    <p>The Divine Sacco member app needs a connection to refresh your balances. Your cached pages are still available.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
